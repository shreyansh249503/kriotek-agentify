name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Placeholder values so the app and tests can boot in CI. Unit tests mock
# Supabase/Postgres, and the Playwright suite intercepts every API and
# Supabase request, so no real credentials are needed or used here.
# The Supabase URL must keep this project ref: the e2e auth helpers write the
# session to `sb-bhyrxyzokssibgeznojo-auth-token`, which supabase-js derives
# from the URL.
env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SUPABASE_URL: https://bhyrxyzokssibgeznojo.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  SUPABASE_URL: https://bhyrxyzokssibgeznojo.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
  NEXT_PUBLIC_API_URL: http://localhost:3000
  NEXT_PUBLIC_WIDGET_URL: http://localhost:3000
  SHOPIFY_API_KEY: ci-placeholder-shopify-key
  SHOPIFY_API_SECRET: ci-placeholder-shopify-secret
  NEXT_PUBLIC_SHOPIFY_API_KEY: ci-placeholder-shopify-key

jobs:
  unit:
    name: Unit tests (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run Jest
        run: npm test -- --ci

  e2e:
    name: E2E tests (Playwright, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts `npm run dev` itself (webServer).
      - name: Run Playwright
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
